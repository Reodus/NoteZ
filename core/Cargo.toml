[package]
name = "notez-core"
version = "0.12.7"
description = "NoteZ core (vault + Typst rendering)"
authors = ["Amir Mohammad Jahangirzad"]
license = "Apache-2.0"
repository = "https://github.com/Reodus/NoteZ"
edition = "2024"


[lib]
name = "notez_lib"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_yaml_ng = "0.10.0"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-packages", "system-downloader", "datetime"] }
typst-layout = "0.15.1"
typst-render = "0.15.1"
unicode-normalization = "0.1"
regex = "1"
flate2 = "1"
blake3 = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
base64 = "0.22"
ureq = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Word export (.docx is a zip of XML parts) and image sizes for it.
zip = { version = "=9.1.0", default-features = false, features = ["deflate-flate2"] }
imagesize = "0.14"


# ThinLTO with many codegen units: the final optimize/link step runs on all
# CPU cores. (`lto = true` + `codegen-units = 1` did it on one core, which
# made every release build of the Typst-sized dependency tree slow, for a
# few percent of binary size and speed.)
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
strip = true

[[bin]]
name = "notez-core"
path = "src/main.rs"

# No debug info for dev builds: much smaller build directory.
[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = false
