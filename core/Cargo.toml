[package]
name = "notez-core"
version = "0.5.1"
description = "NoteZ core (vault + Typst rendering)"
authors = ["Amir Mohammad Jahangirzad"]
license = "MIT"
repository = "https://github.com/Reodus/NoteZ"
edition = "2024"


[lib]
name = "notez_lib"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_yaml_ng = "0.10.0"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-packages", "system-downloader", "datetime"] }
typst-layout = "0.15.1"


[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[[bin]]
name = "notez-core"
path = "src/main.rs"

# No debug info for dev builds: much smaller build directory.
[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = false
