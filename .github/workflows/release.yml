# Builds the Linux packages (AppImage, .deb, .rpm), the Windows installer and
# portable .exe, and the macOS .dmg/.zip (Apple Silicon and Intel), then
# publishes them all as one GitHub release. Runs when
# a version tag is pushed:
#   git tag v0.4.2 && git push origin v0.4.2
# The tag must match "version" in package.json.
#
# latest-linux.yml and latest.yml are what installed copies read to update
# themselves (electron/updater.mjs); they must stay next to the packages.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.4.2"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            files: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
              release/latest-linux.yml
          - os: windows-latest
            platform: win
            files: |
              release/*.exe
              release/latest.yml
          - os: macos-latest # Apple Silicon
            platform: mac
            arch: arm64
            files: |
              release/*.dmg
              release/*.zip
          - os: macos-15-intel
            platform: mac
            arch: x64
            files: |
              release/*.dmg
              release/*.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned builds
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.arch && format('--{0}', matrix.arch) || '' }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: NoteZ ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest-linux.yml
            release/latest.yml
