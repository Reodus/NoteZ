# Builds the Linux packages (AppImage, .deb, .rpm), the Windows installer and
# portable .exe, and the macOS .dmg/.zip (Apple Silicon and Intel), then
# publishes them all as one GitHub release. Runs when
# a version tag is pushed:
#   git tag v0.4.2 && git push origin v0.4.2
# The tag must match "version" in package.json.
#
# latest-linux.yml and latest.yml are what installed copies read to update
# themselves (electron/updater.mjs); they must stay next to the packages.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional existing release tag. Leave blank to test the selected branch."
        required: false
      publish:
        description: "Publish the verified packages"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            files: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
              release/latest-linux.yml
          - os: windows-latest
            platform: win
            files: |
              release/*.exe
              release/latest.yml
          - os: macos-latest # Apple Silicon
            platform: mac
            arch: arm64
            files: |
              release/*.dmg
              release/*.zip
          - os: macos-15-intel
            platform: mac
            arch: x64
            files: |
              release/*.dmg
              release/*.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.sha }}

      - name: Check tag matches package.json
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ -n "$TAG" && "v$version" != "$TAG" ]] || [[ -z "$TAG" && "$PUBLISH" == true ]]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "NOTEZ_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        if: matrix.platform != 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned builds
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.arch && format('--{0}', matrix.arch) || '' }} --publish never

      - name: Package macOS app
        if: matrix.platform == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ARCH: ${{ matrix.arch }}
        run: |
          npx electron-builder --mac --"$ARCH" --dir --publish never
          apps=(release/mac*/NoteZ.app)
          test "${#apps[@]}" -eq 1
          test -d "${apps[0]}"
          echo "NOTEZ_MAC_APP=${apps[0]}" >> "$GITHUB_ENV"
          expected="$ARCH"
          if [[ "$ARCH" == x64 ]]; then expected=x86_64; fi
          executable="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "${apps[0]}/Contents/Info.plist")"
          test "$(lipo -archs "${apps[0]}/Contents/MacOS/$executable")" = "$expected"
          test "$(lipo -archs "${apps[0]}/Contents/Resources/notez-core")" = "$expected"

      - name: Build macOS ZIP
        if: matrix.platform == 'mac'
        env:
          ARCH: ${{ matrix.arch }}
        run: npx electron-builder --mac zip --"$ARCH" --prepackaged "$NOTEZ_MAC_APP" --publish never

      - name: Build and verify macOS DMG
        if: matrix.platform == 'mac'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -o pipefail
          package="release/NoteZ-$NOTEZ_VERSION-mac-$ARCH"
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/notez-dmg-$attempt.log"
            if npx electron-builder --mac dmg --"$ARCH" --prepackaged "$NOTEZ_MAC_APP" --publish never 2>&1 | tee "$log"; then
              break
            fi
            if [[ "$attempt" == 3 ]] || ! grep -q 'Unable to detach device cleanly' "$log" || ! grep -q 'Resource busy' "$log"; then
              hdiutil info | tee "$RUNNER_TEMP/notez-dmg-devices.log"
              exit 1
            fi
            rm -f -- "$package.dmg"
            sleep "$((attempt * 5))"
          done
          hdiutil verify "$package.dmg"
          unzip -tq "$package.zip"

      - uses: actions/upload-artifact@v4
        if: failure() && matrix.platform == 'mac'
        with:
          name: dmg-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/notez-dmg-*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Check both macOS architectures
        run: |
          for arch in x64 arm64; do
            for ext in dmg zip; do
              test -s "release/NoteZ-${TAG#v}-mac-$arch.$ext"
            done
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: NoteZ ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest-linux.yml
            release/latest.yml
