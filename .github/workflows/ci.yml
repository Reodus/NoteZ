# Type-check and build the UI, and run the Rust core's tests, on every push
# and pull request. The core is also built on Windows and tested on macOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npx tsc --noEmit -p .

      - name: Build UI
        run: npx vite build

      - name: Editor highlighting tests
        run: npm run test:asm

      - name: Editor interaction regression tests
        run: npm run test:dir && npm run test:comments && npm run test:stability

      - name: Build core for Electron smoke tests
        run: npm run fonts && npm run core

      - name: Install Electron runtime
        run: node node_modules/electron/install.js

      - name: Electron smoke tests
        run: |
          xvfb-run -a npm run test:ui
          NOTEZ_TEST_LANGUAGE=fa xvfb-run -a npm run test:ui
          xvfb-run -a npm run test:reading

      - name: Test core
        run: cargo test --release --lib --manifest-path core/Cargo.toml

  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build core
        run: cargo build --release --manifest-path core/Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install UI and Electron
        run: npm ci

      - name: Prepare Electron core and fonts
        run: npm run fonts && npm run core

      - name: Live reading regression on Windows
        run: npm run test:reading

  macos-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Test core
        run: cargo test --release --lib --manifest-path core/Cargo.toml
